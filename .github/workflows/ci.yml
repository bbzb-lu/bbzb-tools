name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Braveold liegt im privaten Repo, die Unit-Tests lesen sie
      - uses: actions/checkout@v5
        with:
          repository: bbzb-lu/bbzb-tools-fonts
          path: fonts-private
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Braveold nicht im öffentlichen Repo
        run: "! git ls-files | grep -i braveold"

  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v5
        with:
          repository: bbzb-lu/bbzb-tools-fonts
          path: fonts-private
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
      - name: ffmpeg
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: Testvideos
        shell: bash
        run: sh apps/social-studio/scripts/make-test-videos.sh
      # channel msedge nutzt das vorinstallierte Edge
      - run: npm run test:e2e -- --reporter=html
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/checkout@v5
        with:
          repository: bbzb-lu/bbzb-tools-fonts
          path: fonts-private
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
      # ohne Braveold wäre das Live-Studio unbrauchbar
      - run: node scripts/fonts.mjs --check
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-live-build.mjs
      - run: npx wrangler pages deploy dist --project-name bbzb-tools --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
