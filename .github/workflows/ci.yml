name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Braveold liegt im privaten Repo, die Unit-Tests lesen sie
      - uses: actions/checkout@v5
        with:
          repository: bbzb-lu/bbzb-tools-fonts
          path: fonts-private
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Live-Build wie beim Deploy, ohne Testhaken
      - run: npm run build
      - run: node scripts/check-live-build.mjs
      - name: Braveold nicht im öffentlichen Repo
        run: "! git ls-files | grep -i braveold"

  # Welche Playwright-Projekte laufen: im PR nur geänderte Tools, bei Gemeinsamem und auf main alle
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.p.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: p
        run: node scripts/e2e-projects.mjs "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: changes
    # Windows mit Edge ist die Zielplattform; Linux war nicht schneller und weicht bei Video und Pixeln ab
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v5
        with:
          repository: bbzb-lu/bbzb-tools-fonts
          path: fonts-private
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
      - name: ffmpeg
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: Testvideos
        shell: bash
        run: sh apps/social-studio/scripts/make-test-videos.sh
      - run: npm run test:e2e -- ${{ needs.changes.outputs.projects }} --shard ${{ matrix.shard }}/3 --pass-with-no-tests --reporter=html
        shell: bash
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/checkout@v5
        with:
          repository: bbzb-lu/bbzb-tools-fonts
          path: fonts-private
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
      # ohne Braveold wäre das Live-Studio unbrauchbar
      - run: node scripts/fonts.mjs --check
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-live-build.mjs
      - run: npx wrangler pages deploy dist --project-name bbzb-tools --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Vorschau pro PR: eigene Adresse bei Cloudflare, die Live-Seite bleibt unberührt. Nur Branches aus diesem Repo (Forks haben keine Secrets).
  vorschau:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: vorschau-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/checkout@v5
        with:
          repository: bbzb-lu/bbzb-tools-fonts
          path: fonts-private
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-live-build.mjs
      - id: deploy
        run: |
          npx wrangler pages deploy dist --project-name bbzb-tools --branch "$BRANCH" | tee deploy.log
          url=$(grep -o 'https://[a-z0-9-]*\.bbzb-tools\.pages\.dev' deploy.log | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          BRANCH: ${{ github.head_ref }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: gh pr comment "$PR" --edit-last --create-if-none --body "Vorschau dieses PR (Stand $SHA): $URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
