name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Windows-Lauf (Zielplattform): wöchentlich und auf Knopfdruck, sonst Linux, weil schneller
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Braveold liegt im privaten Repo, die Unit-Tests lesen sie
      - uses: actions/checkout@v5
        with:
          repository: bbzb-lu/bbzb-tools-fonts
          path: fonts-private
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Live-Build wie beim Deploy, ohne Testhaken
      - run: npm run build
      - run: node scripts/check-live-build.mjs
      - name: Braveold nicht im öffentlichen Repo
        run: "! git ls-files | grep -i braveold"

  # Welche Playwright-Projekte laufen: im PR nur geänderte Tools, bei Gemeinsamem und auf main alle
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      projects: ${{ steps.p.outputs.projects }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: p
        run: node scripts/e2e-projects.mjs "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}" >> "$GITHUB_OUTPUT"

  e2e:
    needs: changes
    runs-on: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v5
        with:
          repository: bbzb-lu/bbzb-tools-fonts
          path: fonts-private
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
      # Windows hat Edge vorinstalliert, Linux nicht
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps msedge
      - name: ffmpeg
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y --no-progress }
      - name: ffmpeg
        if: runner.os == 'Linux'
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Testvideos
        shell: bash
        run: sh apps/social-studio/scripts/make-test-videos.sh
      - run: npm run test:e2e -- ${{ needs.changes.outputs.projects }} --shard ${{ matrix.shard }}/3 --pass-with-no-tests --reporter=html
        shell: bash
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report-${{ runner.os }}-${{ matrix.shard }}
          path: playwright-report/

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/checkout@v5
        with:
          repository: bbzb-lu/bbzb-tools-fonts
          path: fonts-private
          ssh-key: ${{ secrets.FONTS_DEPLOY_KEY }}
      # ohne Braveold wäre das Live-Studio unbrauchbar
      - run: node scripts/fonts.mjs --check
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-live-build.mjs
      - run: npx wrangler pages deploy dist --project-name bbzb-tools --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
