<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BBZB Radio</title>
  <link rel="icon" type="image/png" href="../_shared/icons/music_note_icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card card--pink">

    <div class="titlebar">
      <div class="dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <span class="titlebar-text">BBZB RADIO</span>
      <img src="../_shared/icons/music_note_icon.png" class="titlebar-icon" alt="">
    </div>

    <div class="card-body">

      <p class="radio-tagline">Auf dem Laufenden bleiben:</p>
      <p class="now-playing" id="now-playing">● Jetzt live: Radio Pilatus</p>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="controls-row">

        <button class="btn-icon" id="btn-like" title="Gefällt mir" aria-label="Like" aria-pressed="false">
          <img src="../_shared/icons/pixel heart.png" class="ctrl-icon" alt="Like">
        </button>

        <button class="btn-icon btn-icon--flip" id="btn-prev" title="Von vorne" aria-label="Neustart">
          <img src="../_shared/icons/pixel skip.png" class="ctrl-icon" alt="Zurück">
        </button>

        <button class="btn-play" id="btn-play" title="Abspielen / Pause" aria-label="Abspielen">
          <img class="icon-play"  src="../_shared/icons/pixel play.png"  alt="Abspielen">
          <img class="icon-pause" src="../_shared/icons/pixel pause.png" alt="Pause" style="display:none">
        </button>

        <button class="btn-icon" id="btn-next" title="Weiter" aria-label="Weiter">
          <img src="../_shared/icons/pixel skip.png" class="ctrl-icon" alt="Weiter">
        </button>

        <button class="btn-icon" id="btn-repeat" title="Wiederholen" aria-label="Wiederholen" aria-pressed="false">
          <img src="../_shared/icons/pixel shuffle.png" class="ctrl-icon" alt="Wiederholen">
        </button>

      </div>

    </div>
  </div>

  <audio id="radio-audio" preload="none"></audio>
  <script src="script.js"></script>
</body>
</html>
